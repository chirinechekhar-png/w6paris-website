<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commandes — W6 Paris</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="canonical" href="https://w6paris.com/https://w6paris.com/orders.html">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div id="adminApp">

  <!-- LOGIN -->
  <section id="loginView" class="admin-login">
    <div class="admin-login-card">
      <img src="images/logo.png" alt="W6 Paris" style="height:34px;margin-bottom:28px;">
      <h1>Commandes</h1>
      <p class="admin-login-sub">Espace réservé — W6 Paris</p>
      <form id="loginForm">
        <label class="admin-label" for="loginPass">Mot de passe</label>
        <input class="admin-input" type="password" id="loginPass" autocomplete="current-password" required>
        <p class="admin-error" id="loginError" style="display:none;">Mot de passe incorrect.</p>
        <button class="btn btn-solid admin-btn" type="submit">Se connecter</button>
      </form>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="dashView" class="admin-dash" style="display:none;">
    <header class="admin-topbar">
      <div class="admin-topbar-inner">
        <img src="images/logo.png" alt="W6 Paris" style="height:26px;">
        <div class="admin-topbar-actions">
          <a class="admin-link" href="admin.html">← Inventaire</a>
          <a class="admin-link" href="index.html" target="_blank">Voir le site ↗</a>
          <button class="admin-link-btn" id="logoutBtn">Se déconnecter</button>
        </div>
      </div>
    </header>

    <div class="admin-wrap">
      <div class="admin-head">
        <div>
          <h1>Commandes</h1>
          <p class="admin-sub" id="ordersSub">Aucune commande.</p>
        </div>
        <div class="admin-head-actions">
          <a class="btn" id="exportBtn" href="/api/admin/orders/export">Exporter CSV</a>
          <button class="btn" id="viewAllBtn" type="button">Tout marquer lu</button>
        </div>
      </div>

      <div class="stats-grid" id="statsGrid" style="display:none;">
        <div class="stat-card"><span class="stat-label">Chiffre d'affaires</span><strong class="stat-value" id="stRevenue">—</strong></div>
        <div class="stat-card"><span class="stat-label">Commandes actives</span><strong class="stat-value" id="stOrders">—</strong></div>
        <div class="stat-card"><span class="stat-label">Panier moyen</span><strong class="stat-value" id="stAvg">—</strong></div>
        <div class="stat-card"><span class="stat-label">Top produit</span><strong class="stat-value" id="stTop" style="font-size:15px;">—</strong></div>
      </div>

      <div class="admin-filters" id="filterBar"></div>

      <div class="orders-list" id="ordersList"></div>
    </div>
  </section>

</div>

<script src="js/data.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
