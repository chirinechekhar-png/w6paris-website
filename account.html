<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte — W6 Paris</title>
<meta name="description" content="Votre espace client W6 Paris : vos commandes et votre profil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="canonical" href="https://w6paris.com/account.html">
</head>
<body data-page="account">

<main id="main">
  <div class="container">

    <div class="page-hero">
      <span class="eyebrow">W6 Paris</span>
      <h1 data-i18n="account.title">Mon compte</h1>
    </div>

    <!-- LOGIN / REGISTER -->
    <div class="account-box" id="accAuth">
      <div class="account-tabs">
        <button type="button" class="active" data-tab="login" data-i18n="account.login">Connexion</button>
        <button type="button" data-tab="register" data-i18n="account.register">Créer un compte</button>
      </div>

      <form id="accLoginForm">
        <div class="field">
          <label data-i18n="checkout.email">E-mail *</label>
          <input type="email" id="accEmail" required>
        </div>
        <div class="field">
          <label data-i18n="account.password">Mot de passe *</label>
          <input type="password" id="accPass" autocomplete="current-password" required>
        </div>
        <p class="tracking-err" id="accLoginErr" style="display:none;"></p>
        <button type="submit" class="btn btn-solid add-to-cart" data-i18n="account.loginBtn">Se connecter</button>
      </form>

      <form id="accRegisterForm" style="display:none;">
        <div class="field">
          <label data-i18n="account.name">Nom complet *</label>
          <input type="text" id="accRegName" required>
        </div>
        <div class="field">
          <label data-i18n="checkout.email">E-mail *</label>
          <input type="email" id="accRegEmail" required>
        </div>
        <div class="field">
          <label data-i18n="account.password">Mot de passe (6 caractères min.) *</label>
          <input type="password" id="accRegPass" autocomplete="new-password" required>
        </div>
        <p class="tracking-err" id="accRegErr" style="display:none;"></p>
        <button type="submit" class="btn btn-solid add-to-cart" data-i18n="account.registerBtn">Créer mon compte</button>
      </form>
    </div>

    <!-- DASHBOARD -->
    <div class="account-dash" id="accDash" style="display:none;">
      <div class="account-head">
        <div>
          <h2 id="accHello"></h2>
          <p class="notes" id="accEmailLabel"></p>
        </div>
        <button type="button" class="btn" id="accLogoutBtn" data-i18n="account.logout">Se déconnecter</button>
      </div>

      <h3 data-i18n="account.ordersTitle">Mes commandes</h3>
      <div id="accOrders"></div>
      <p class="notes" id="accOrdersEmpty" style="display:none;" data-i18n="account.noOrders">Vous n'avez pas encore de commandes.</p>
    </div>

  </div>
</main>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script src="js/account.js"></script>
</body>
</html>
