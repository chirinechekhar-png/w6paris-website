<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragrances — W6 Paris</title>
<meta name="description" content="Sept fragrances d'intérieur composées à Grasse, disponibles en 10 ml et 100 ml. Ambre Divine, Ébène, Ispahan, Secret Garden, Midnight, Un Jardin à Rio, Rosewood.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="canonical" href="https://w6paris.com/fragrances.html">
</head>
<body data-page="fragrances">

<main id="main">
  <section class="banner-full">
    <img src="images/oil-first.jpg" alt="Huiles parfumées W6 Paris">
    <div class="banner-full-shade"></div>
    <div class="banner-full-copy fade-in">
      <span class="eyebrow" style="color:var(--accent-soft);">Grasse · Capitale du parfum</span>
      <h1 data-i18n="shop.oilsTitle">Fragrances</h1>
      <p data-i18n="shop.oilsSub">Sept senteurs composées à Grasse, disponibles en 10 ml et 100 ml. Chaque parfum éveille les sens et crée une atmosphère qui vous ressemble.</p>
    </div>
  </section>
  <div class="container">
    <div class="grid cols-4" style="padding:72px 0 96px;" data-fragrances></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script>
  window.initPage = function () {
    renderFragranceGrid("[data-fragrances]");
  };
</script>
</body>
</html>
