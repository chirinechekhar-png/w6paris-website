<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livraison — W6 Paris</title>
<meta name="description" content="Conditions de livraison W6 Paris : expédition dans toute l'Union Européenne sous 24-48h.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="shipping">

  <section class="container prose">

</main>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>

       "<li><strong>Espagne, Portugal & Italie</strong></li>" +
       "<li><strong>Allemagne, Autriche & Irlande</strong></li>" +

</html>
