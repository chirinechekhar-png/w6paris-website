<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit — W6 Paris</title>
<meta name="description" content="Diffuseurs à froid et fragrances d'intérieur W6 Paris, composés à Grasse.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="canonical" href="https://w6paris.com/product.html">
</head>
<body data-page="product">

<main id="main">
  <div class="container">
    <div id="productWrap" style="min-height:60vh;"></div>
    <div id="relatedWrap" style="margin-bottom:96px;"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script>
  var selected = {};
  var multiCount = {};

  function optionValues(p, key) {
    return (p.options || []).find(function (o) { return o.key === key; }) || { values: [] };
  }

  function currentPrice(p) {
    if (p.type === "oil") {
      var size = selected.size || "10 ml";
      var sizeOpt = optionValues(p, "size");
      var v = sizeOpt.values.find(function (x) { return x.label === size; });
      return v ? v.price : 18;
    }
    var total = p.price;
    (p.options || []).forEach(function (o) {
      if (o.free) return;
      var sel = selected[o.key];
      var v = o.values.find(function (x) { return x.label === sel; });
      if (v && v.price) total += v.price;
    });
    return total;
  }

  function variantKey(p) {
    var o = (p.options || []).find(function (x) { return !x.free; });
    return o ? o.key : null;
  }

  function currentStock(p) {
    var key = variantKey(p);
    if (key && selected[key]) return variantStock(p, selected[key]);
    return totalStock(p);
  }

  function renderStockLine(p) {
    var wrap = document.getElementById("stockWrap");
    var buy = document.getElementById("buyBtn");
    if (!wrap) return;
    var qty = currentStock(p);
    wrap.innerHTML = qty <= 0
      ? '<p class="stock-line stock-out">' + t("product.soldOut") + '</p>'
      : qty <= 5
        ? '<p class="stock-line stock-low">' + t("product.lowStock").replace("{n}", qty) + '</p>'
        : '<p class="stock-line stock-ok">' + t("product.inStock") + '</p>';
    if (buy) {
      buy.disabled = qty <= 0;
    }
  }

  function selectedOptionsForCart(p) {
    var out = {};
    (p.options || []).forEach(function (o) {
      if (o.key === "fragrance") {
        var list = multiCount[o.key] || [selected[o.key] || o.values[0].label];
        out[o.name[LANG]] = list.join(" + ");
      } else if (o.key === "fragrances") {
        var list2 = multiCount[o.key] || [];
        out[o.name[LANG]] = list2.join(" + ");
      } else {
        out[o.name[LANG]] = selected[o.key];
      }
    });
    return out;
  }

  function renderOption(p, o) {
    var wrap = document.createElement("div");
    wrap.className = "field";
    var required = (o.key === "fragrances") ? ' <span style="color:var(--accent);text-transform:none;">(' + t("bundle.freeLabel") + ')</span>' : "";
    var label = document.createElement("label");
    label.textContent = (o.free ? t("product.freeGift") + " · " : "") + o.name[LANG] + required;
    wrap.appendChild(label);

    var list = document.createElement("div");
    list.className = "option-list";

    var max = (o.key === "fragrances") ? 3 : 1;
    if (o.key === "fragrances") multiCount[o.key] = [];

    o.values.forEach(function (v) {
      var btn = document.createElement("button");
      btn.type = "button";
      if (o.key === "color") {
        btn.className = "color-opt";
        var dot = document.createElement("span");
        dot.className = "swatch " + (v.label === "Noir" ? "noir" : "gris");
        btn.appendChild(dot);
        btn.appendChild(document.createTextNode(" " + v.label));
      } else {
        btn.textContent = v.label;
      }
      if (o.key === "size") btn.textContent += " · " + formatPrice(v.price);
      if (selected[o.key] === v.label) btn.classList.add("active");
      if ((multiCount[o.key] || []).indexOf(v.label) !== -1) btn.classList.add("active");

      btn.addEventListener("click", function () {
        if (max > 1) {
          var arr = multiCount[o.key] || (multiCount[o.key] = []);
          var idx = arr.indexOf(v.label);
          if (idx !== -1) arr.splice(idx, 1);
          else if (arr.length < max) arr.push(v.label);
          else { alert(max + " " + o.name[LANG]); }
          list.querySelectorAll("button").forEach(function (b) {
            var on = (arr.indexOf(b.textContent) !== -1) || (selected[o.key] === b.textContent && arr.length === 0);
            b.classList.toggle("active", on);
          });
        } else {
          selected[o.key] = v.label;
          list.querySelectorAll("button").forEach(function (b) {
            b.classList.toggle("active", b === btn);
          });
          if (o.key === "color") renderGallery();
        }
        renderPrice();
        renderStockLine(window._product);
      });
      list.appendChild(btn);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function renderPrice() {
    var el = document.getElementById("priceDisplay");
    var p = window._product;
    if (!el) return;
    el.innerHTML = formatPrice(currentPrice(p));
    if (p.compareAt) {
      var saved = document.createElement("span");
      saved.style.cssText = "display:block;font-size:13px;color:var(--accent);margin-top:6px;";
      saved.textContent = t("product.saved") + " " + formatPrice(p.compareAt - p.price);
      el.appendChild(saved);
    }
  }

  function activeImages(p) {
    if (p.colorImages && selected.color && p.colorImages[selected.color]) {
      return p.colorImages[selected.color];
    }
    return p.images || [];
  }

  function isVideo(src) {
    return /\.(mov|mp4|webm|ogg)$/i.test(src || "");
  }

  function gallery(p) {
    var imgs = activeImages(p);
    if (!imgs || imgs.length === 0) {
      return '<div class="frag-art ' + (p.art || "p-ambre") + '" style="aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:#fff;">' +
        '<div class="frag-num">W6 · ' + p.family[LANG] + '</div>' +
        '<div class="frag-name" style="font-size:44px;">' + p.name[LANG] + '</div>' +
        '<div class="frag-tag">“' + p.tagline[LANG] + '”</div>' +
        '</div>';
    }
    window._activeImages = imgs;
    var html = '<div class="gallery">';
    html += '<div class="gallery-thumbs">';
    imgs.forEach(function (img, i) {
      html += '<button type="button" onclick="setMain(' + i + ')"' + (i === 0 ? ' class="thumb-active"' : "") + '><img src="' + img + '" alt="' + p.name[LANG] + ' ' + i + '">' + (isVideo(img) ? '<span class="thumb-play">▶</span>' : "") + '</button>';
    });
    html += '</div><div class="gallery-main">';
    html += '<img id="galleryMain" src="' + imgs[0] + '" alt="' + p.name[LANG] + '"' + (isVideo(imgs[0]) ? ' style="display:none"' : "") + '>';
    html += '<video id="galleryMainVideo" controls muted loop playsinline preload="metadata"' + (isVideo(imgs[0]) ? "" : ' style="display:none"') + '></video>';
    html += '</div></div>';
    return html;
  }

  window.setMain = function (i) {
    var imgs = window._activeImages || (window._product ? activeImages(window._product) : []);
    var img = document.getElementById("galleryMain");
    var vid = document.getElementById("galleryMainVideo");
    var src = i < imgs.length ? imgs[i] : null;
    if (src && isVideo(src)) {
      if (vid) {
        vid.src = src;
        vid.style.display = "";
        if (vid.load) vid.load();
        if (vid.play) { var pr = vid.play(); if (pr && pr.catch) pr.catch(function () {}); }
      }
      if (img) img.style.display = "none";
    } else {
      if (img) { img.src = src; img.style.display = ""; }
      if (vid) { if (vid.pause) vid.pause(); vid.src = ""; vid.style.display = "none"; }
    }
    document.querySelectorAll(".gallery-thumbs button").forEach(function (b, k) {
      b.classList.toggle("thumb-active", k === i);
    });
  };

  function renderGallery() {
    var p = window._product;
    var wrap = document.getElementById("galleryWrap");
    if (p && wrap) wrap.innerHTML = gallery(p);
  }

  function notesPyramid(p) {
    if (!p.notes) return "";
    return '<div class="notes-pyramid">' +
      '<div class="note-col"><h5>' + t("product.notesTop") + '</h5><p>' + p.notes.top[LANG] + '</p></div>' +
      '<div class="note-col"><h5>' + t("product.notesHeart") + '</h5><p>' + p.notes.heart[LANG] + '</p></div>' +
      '<div class="note-col"><h5>' + t("product.notesBase") + '</h5><p>' + p.notes.base[LANG] + '</p></div>' +
      '</div>';
  }

  function renderProduct(handle) {
    var p = getProduct(handle);
    if (!p) {
      document.getElementById("productWrap").innerHTML = '<p class="center" style="padding:80px 0;">Product not found.</p>';
      return;
    }
    window._product = p;

    (p.options || []).forEach(function (o) {
      if (!selected[o.key]) {
        if (o.free && o.key !== "fragrances") selected[o.key] = o.values[0].label;
        else if (o.free && o.key === "fragrances") { /* multi handled separately */ }
        else selected[o.key] = o.values[0].label;
      }
    });

    var featuresHtml = p.features && p.features.length
      ? '<div class="acc-item"><button class="acc-head" onclick="toggleAcc(this)">' + t("product.featuresTitle") + '</button><div class="acc-body"><div class="acc-body-inner"><ul style="padding-left:0;list-style:none;">' +
        p.features.map(function (f) { return '<li style="padding:6px 0 6px 22px;position:relative;">' + f[LANG] + '</li>'; }).join("") +
        '</ul></div></div></div>'
      : "";

    var notesHtml = p.notes
      ? '<div class="acc-item open"><button class="acc-head" onclick="toggleAcc(this)">' + t("product.notesTitle") + '</button><div class="acc-body" style="max-height:500px;"><div class="acc-body-inner">' + notesPyramid(p) + '</div></div></div>'
      : "";

    var configHtml = (p.type === "diffuser")
      ? '<div class="acc-item"><button class="acc-head" onclick="toggleAcc(this)">' + t("product.configuration") + '</button><div class="acc-body"><div class="acc-body-inner"><ol style="padding-left:20px;margin:0;">' +
        t("config.steps").map(function (s) { return '<li style="margin-bottom:8px;">' + s + '</li>'; }).join("") +
        '</ol></div></div></div>'
      : "";

    var descHtml = '<div class="acc-item open"><button class="acc-head" onclick="toggleAcc(this)">' + t("product.description") + '</button><div class="acc-body" style="max-height:500px;"><div class="acc-body-inner">' + p.desc[LANG] + '</div></div></div>';

    var freeGiftHtml = p.freeGift
      ? '<p style="font-size:13px;letter-spacing:.08em;color:var(--accent);margin-bottom:16px;">' + p.freeGift[LANG] + '</p>'
      : "";

    var addLabel = (p.type === "bundle") ? t("product.addToBundle") : t("product.addToCart");

    document.getElementById("productWrap").innerHTML =
      '<div class="product-layout">' +
      '<div id="galleryWrap">' + gallery(p) + '</div>' +
      '<div class="product-info">' +
      '<div class="product-type">' + p.family[LANG] + '</div>' +
      '<h1>' + p.name[LANG] + '</h1>' +
      (p.type === "oil" ? '<p class="product-desc" style="font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink);">“' + p.tagline[LANG] + '”</p>' : "") +
      '<div class="product-price" id="priceDisplay"></div>' +
      freeGiftHtml +
      '<div id="stockWrap"></div>' +
      '<div id="optionFields"></div>' +
      '<div class="field"><label>' + t("product.fulfillmentTitle") + '</label>' +
      '<div class="option-list" id="fulfillmentList">' +
      '<button type="button" class="active" data-full="delivery">' + t("product.fulfillmentDelivery") + '</button>' +
      '<button type="button" data-full="pickup">' + t("product.fulfillmentPickup") + '</button>' +
      '</div><p class="notes" id="pickupNote" style="display:none;margin-top:8px;color:var(--accent);">' + t("product.storeAddress") + '</p>' +
      '<div class="pickup-schedule" id="pickupSchedule" style="display:none;">' +
      '<div class="pickup-field"><label>' + t("product.pickupDate") + '</label><input type="date" id="pickupDate"></div>' +
      '<div class="pickup-field"><label>' + t("product.pickupTime") + '</label><input type="time" id="pickupTime"></div>' +
      '</div></div>' +
      '<div class="qty-row"><div class="qty"><button onclick="changeQtyLocal(-1)">−</button><input id="qtyInput" type="number" value="1" min="1"><button onclick="changeQtyLocal(1)">+</button></div></div>' +
      '<button class="btn btn-solid add-to-cart" id="buyBtn" onclick="addProduct()">' + addLabel + '</button>' +
      '<p class="notes">' + t("product.included") + ' · ' + t("cart.note") + '</p>' +
      '<div class="accordion">' + descHtml + featuresHtml + notesHtml + configHtml + '</div>' +
      '</div></div>';

    renderPrice();
    renderStockLine(p);

    var optionFields = document.getElementById("optionFields");
    optionFields.innerHTML = "";
    (p.options || []).forEach(function (o) {
      optionFields.appendChild(renderOption(p, o));
    });

    selected.fulfillment = "delivery";
    var fullBtns = document.querySelectorAll("#fulfillmentList button");
    fullBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        selected.fulfillment = b.dataset.full;
        fullBtns.forEach(function (x) { x.classList.toggle("active", x === b); });
        var note = document.getElementById("pickupNote");
        if (note) note.style.display = b.dataset.full === "pickup" ? "block" : "none";
        var sched = document.getElementById("pickupSchedule");
        if (sched) sched.style.display = b.dataset.full === "pickup" ? "grid" : "none";
      });
    });
  }

  window.changeQtyLocal = function (d) {
    var input = document.getElementById("qtyInput");
    var v = parseInt(input.value || "1", 10) + d;
    if (v < 1) v = 1;
    input.value = v;
  };

  window.addProduct = function () {
    var p = window._product;
    if (currentStock(p) <= 0) {
      alert(t("product.soldOut"));
      return;
    }
    if (p.type === "bundle" && (p.options || []).some(function (o) { return o.key === "fragrances"; })) {
      var frags = multiCount.fragrances || [];
      if (frags.length < 3) { alert("3 " + t("bundle.freeLabel")); return; }
    }
    var qty = parseInt(document.getElementById("qtyInput").value || "1", 10);
    var opts = selectedOptionsForCart(p);
    if (selected.fulfillment) {
      opts[t("product.fulfillmentTitle")] = (selected.fulfillment === "pickup")
        ? t("product.fulfillmentPickup")
        : t("product.fulfillmentDelivery");
      if (selected.fulfillment === "pickup") {
        var d = document.getElementById("pickupDate").value;
        var tm = document.getElementById("pickupTime").value;
        if (!d || !tm) {
          alert(t("product.pickupRequired"));
          return;
        }
        opts[t("cart.pickupLabel")] = d + " " + tm;
      }
    }
    addToCart({
      handle: p.handle,
      qty: qty,
      price: currentPrice(p),
      options: opts
    });
  };

  window.toggleAcc = function (btn) {
    var item = btn.parentElement;
    var body = item.querySelector(".acc-body");
    var open = item.classList.toggle("open");
    body.style.maxHeight = open ? body.scrollHeight + "px" : "0px";
  };

  function renderRelated() {
    var p = window._product;
    if (!p) return;
    var related;
    if (p.type === "diffuser" || p.type === "bundle") related = oilProducts().slice(0, 4);
    else related = oilProducts().filter(function (x) { return x.handle !== p.handle; }).slice(0, 4);
    document.getElementById("relatedWrap").innerHTML =
      '<div class="section-head"><span class="eyebrow">W6 Paris</span><h2 style="font-size:32px;">' + t("product.related") + '</h2></div>' +
      '<div class="grid cols-4">' + related.map(function (r) { return productCard(r); }).join("") + '</div>';
  }

  window.initPage = function () {
    var params = new URLSearchParams(window.location.search);
    var handle = params.get("p") || "diffuseur-i6";
    renderProduct(handle);
    renderRelated();
  };
</script>
</body>
</html>
